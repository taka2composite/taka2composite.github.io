<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --teal: #1a9ba1; --teal-dark: #137a7f; --teal-light: #e8f6f7; --teal-mid: #b2dfe1;
    --white: #ffffff; --off-white: #f8fafa;
    --text: #1a2e2f; --text-muted: #5a7a7c; --text-dim: #9ab8ba;
    --border: rgba(26,155,161,0.12); --border-hover: rgba(26,155,161,0.3);
    --font-display: 'Barlow Condensed', sans-serif;
    --font-body: 'Barlow', sans-serif;
    --font-jp: 'Noto Sans JP', sans-serif;
  }
  html { scroll-behavior: smooth; }
  body { background: var(--white); color: var(--text); font-family: var(--font-body); font-weight: 400; line-height: 1.7; overflow-x: hidden; }

  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 3rem; height: 60px; background: rgba(255,255,255,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
  .nav-logo { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; letter-spacing: 0.15em; color: var(--teal); text-decoration: none; text-transform: uppercase; }
  .nav-links { display: flex; gap: 2.5rem; list-style: none; }
  .nav-links a { font-family: var(--font-display); font-size: 0.8rem; font-weight: 400; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
  .nav-links a:hover, .nav-links a.active { color: var(--teal); }
  .nav-social { display: flex; gap: 1.2rem; align-items: center; }
  .nav-social a { font-family: var(--font-display); font-size: 0.72rem; font-weight: 400; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
  .nav-social a:hover { color: var(--teal); }

  .page-header { padding: 8rem 2rem 3rem; border-bottom: 1px solid var(--border); background: var(--teal); position: relative; overflow: hidden; }
  .page-header-pattern { position: absolute; inset: 0; opacity: 0.08; pointer-events: none; }
  .page-header-pattern svg { width: 100%; height: 100%; }
  .page-header .container { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 1.5rem; position: relative; z-index: 1; }
  .page-header-eyebrow { font-family: var(--font-display); font-size: 0.72rem; letter-spacing: 0.3em; text-transform: uppercase; color: rgba(255,255,255,0.65); margin-bottom: 0.75rem; }
  .page-header-title { font-family: var(--font-display); font-size: clamp(3rem, 6vw, 5rem); font-weight: 700; letter-spacing: 0.05em; line-height: 1; color: white; }
  .page-header-count { font-family: var(--font-display); font-size: 0.8rem; letter-spacing: 0.1em; color: rgba(255,255,255,0.6); text-align: right; }
  .page-header-count span { font-size: 2.5rem; font-weight: 600; color: white; display: block; line-height: 1; margin-bottom: 0.3rem; }

  .media-section { padding: 4rem 2rem 7rem; }
  .container { max-width: 1100px; margin: 0 auto; }

  .media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }

  .media-card { background: white; border: 1px solid var(--border); overflow: hidden; transition: all 0.2s; text-decoration: none; display: block; }
  .media-card:hover { border-color: var(--teal-mid); box-shadow: 0 4px 20px rgba(26,155,161,0.08); transform: translateY(-2px); }

  .media-embed { position: relative; padding-bottom: 56.25%; background: var(--teal-light); cursor: pointer; }
  .media-embed iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
  .media-embed-thumb { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
  .media-play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 56px; height: 56px; background: rgba(26,155,161,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; pointer-events: none; transition: all 0.2s; }
  .media-play-btn::after { content: ''; border-left: 20px solid white; border-top: 12px solid transparent; border-bottom: 12px solid transparent; margin-left: 4px; }
  .media-embed:hover .media-play-btn { background: var(--teal); transform: translate(-50%,-50%) scale(1.1); }

  .media-meta { padding: 1rem 1.2rem; border-top: 2px solid var(--teal-light); }
  .media-meta-source { font-family: var(--font-display); font-size: 0.68rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--teal); margin-bottom: 0.3rem; }
  .media-meta-title { font-family: var(--font-jp); font-size: 0.9rem; font-weight: 400; color: var(--text); margin-bottom: 0.3rem; line-height: 1.4; }
  .media-meta-date { font-family: var(--font-display); font-size: 0.68rem; color: var(--text-dim); }

  .media-article { display: flex; align-items: flex-start; gap: 1rem; padding: 1.2rem; }
  .media-article-icon { width: 40px; height: 40px; background: var(--teal-light); border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--teal); font-size: 1rem; font-weight: 700; font-family: var(--font-display); }
  .media-thumbnail { position: relative; padding-bottom: 56.25%; background: var(--teal-light); overflow: hidden; }
  .media-thumbnail img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
  .media-card:hover .media-thumbnail img { transform: scale(1.03); }
  .media-article-body { flex: 1; }
  .media-article-source { font-family: var(--font-display); font-size: 0.68rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--teal); margin-bottom: 0.3rem; }
  .media-article-title { font-family: var(--font-jp); font-size: 0.9rem; font-weight: 400; color: var(--text); margin-bottom: 0.3rem; line-height: 1.4; }
  .media-article-date { font-family: var(--font-display); font-size: 0.68rem; color: var(--text-dim); }
  .media-arrow { margin-left: auto; color: var(--teal); font-size: 1rem; padding-left: 0.5rem; flex-shrink: 0; }

  .loading-msg { color: var(--text-dim); font-family: var(--font-display); font-size: 0.8rem; letter-spacing: 0.1em; padding: 2rem 0; }
  .empty-msg { font-family: var(--font-jp); font-size: 0.9rem; color: var(--text-muted); padding: 4rem 0; text-align: center; }

  footer { background: var(--teal-dark); padding: 1.5rem 3rem; display: flex; align-items: center; justify-content: space-between; }
  .footer-logo { font-family: var(--font-display); font-size: 0.8rem; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.4); }
  .footer-copy { font-family: var(--font-display); font-size: 0.65rem; color: rgba(255,255,255,0.3); letter-spacing: 0.1em; }

  .page-top-btn { position: fixed; bottom: 2rem; right: 2rem; z-index: 200; width: 48px; height: 48px; background: var(--teal); border: none; color: white; font-family: var(--font-display); font-size: 1.2rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; border-radius: 50%; }
  .page-top-btn.visible { opacity: 1; pointer-events: auto; }
  .page-top-btn:hover { background: var(--teal-dark); }

  .fade-in { opacity: 0; transform: translateY(16px); transition: opacity 0.5s ease, transform 0.5s ease; }
  .fade-in.visible { opacity: 1; transform: translateY(0); }

  @media (max-width: 768px) {
    nav { padding: 0 1.2rem; height: 52px; }

    .nav-social { display: none; }
    .nav-links { gap: 1rem; }
    .nav-links a { font-size: 0.7rem; letter-spacing: 0.08em; }
    .page-header { padding: 6rem 1.2rem 2rem; }
    .media-section { padding: 2rem 1.2rem 4rem; }
    .media-grid { grid-template-columns: 1fr; }
    footer { flex-direction: column; gap: 0.5rem; text-align: center; padding: 1.5rem; }
  }
</style>

<script>
  const MEDIA_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSTur1uP4etEukILyzdq3QsUZ6_WG8qj0uWqOFBteQavAEkImRhCeaeNkf0VwdlESRTt8hQ5Qz-ZxnH/pub?gid=1499370673&single=true&output=csv';

  function parseCSV(text) {
    const lines = text.trim().split('\n');
    const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
    return lines.slice(1).map(line => {
      const values = [];
      let cur = '', inQ = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') { inQ = !inQ; }
        else if (c === ',' && !inQ) { values.push(cur.trim()); cur = ''; }
        else { cur += c; }
      }
      values.push(cur.trim());
      const obj = {};
      headers.forEach((h, i) => obj[h] = (values[i] || '').replace(/^"|"$/g, ''));
      return obj;
    });
  }

  function getYoutubeId(url) {
    if (!url) return null;
    const m = url.match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{11})/);
    return m ? m[1] : null;
  }

  function loadMediaVideo(el, id) {
    el.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1" allowfullscreen allow="autoplay" style="position:absolute;top:0;left:0;width:100%;height:100%;border:none;"></iframe>`;
  }

  function observeFadeIns() {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.05 });
    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
  }

  async function loadMedia() {
    try {
      const res = await fetch(MEDIA_CSV_URL);
      if (!res.ok) throw new Error('fetch failed');
      const text = await res.text();
      const items = parseCSV(text).filter(m => m.title || m.media);
      const el = document.getElementById('mediaGrid');
      document.getElementById('mediaCount').textContent = items.length;

      if (!items.length) {
        el.innerHTML = '<p class="empty-msg">メディア掲載情報はまだありません。</p>';
        return;
      }

      el.innerHTML = items.map((m, i) => {
        const youtubeId = getYoutubeId(m.url || '');
        const isVideo = (m.type || '').toLowerCase() === 'video' || youtubeId;
        const delay = `transition-delay:${(i % 6) * 0.08}s`;

        const thumbnailUrl = (m.thumbnail_url || '').trim();

        if (thumbnailUrl) {
          // サムネイル画像あり
          const inner = `
            <div class="media-thumbnail">
              <img src="${thumbnailUrl}" alt="${m.title||''}" loading="lazy" onerror="this.style.display='none';">
            </div>
            <div class="media-meta">
              <p class="media-meta-source">${m.media || ''}</p>
              <p class="media-meta-title">${m.title || ''}</p>
              <p class="media-meta-date">${m.date || ''}</p>
            </div>`;
          if (m.url) {
            return `<a href="${m.url}" target="_blank" rel="noopener" class="media-card fade-in" style="${delay}">${inner}</a>`;
          } else {
            return `<div class="media-card fade-in" style="${delay}">${inner}</div>`;
          }
        } else if (isVideo && youtubeId) {
          return `<div class="media-card fade-in" style="${delay}">
            <div class="media-embed" onclick="loadMediaVideo(this, '${youtubeId}')">
              <img class="media-embed-thumb" src="https://img.youtube.com/vi/${youtubeId}/mqdefault.jpg" alt="${m.title||''}" loading="lazy">
              <div class="media-play-btn"></div>
            </div>
            <div class="media-meta">
              <p class="media-meta-source">${m.media || ''}</p>
              <p class="media-meta-title">${m.title || ''}</p>
              <p class="media-meta-date">${m.date || ''}</p>
            </div>
          </div>`;
        } else {
          return `<a href="${m.url || '#'}" target="_blank" rel="noopener" class="media-card fade-in" style="${delay}">
            <div class="media-article">
              <div class="media-article-icon">✎</div>
              <div class="media-article-body">
                <p class="media-article-source">${m.media || ''}</p>
                <p class="media-article-title">${m.title || ''}</p>
                <p class="media-article-date">${m.date || ''}</p>
              </div>
              <span class="media-arrow">↗</span>
            </div>
          </a>`;
        }
      }).join('');

      observeFadeIns();
    } catch(e) {
      document.getElementById('mediaGrid').innerHTML = '<p class="empty-msg">データの読み込みに失敗しました。</p>';
    }
  }

  loadMedia();

  window.addEventListener('scroll', () => {
    document.getElementById('pageTopBtn').classList.toggle('visible', window.scrollY > 300);
  });
</script>
