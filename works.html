<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Works — JUNPEI TAKATSU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@400;500;600&family=Noto+Sans+JP:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #ffffff; --bg2: #f8fafa; --bg3: #f0f7f7;
    --border: rgba(26,155,161,0.12); --border-hover: rgba(26,155,161,0.3);
    --text: #1a2e2f; --text-muted: #5a7a7c; --text-dim: #9ab8ba; --accent: #1a9ba1;
    --teal: #1a9ba1; --teal-dark: #137a7f; --teal-light: #e8f6f7; --teal-mid: #b2dfe1;
    --font-display: 'Barlow Condensed', sans-serif;
    --font-body: 'Barlow', sans-serif;
    --font-jp: 'Noto Sans JP', sans-serif;
  }
  html { scroll-behavior: smooth; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-weight: 400; line-height: 1.7; overflow-x: hidden; }

  nav { position: fixed; top: 0; left: 0; right: 0; z-index: 100; display: flex; align-items: center; justify-content: space-between; padding: 0 3rem; height: 60px; background: rgba(255,255,255,0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
  .nav-logo { font-family: var(--font-display); font-size: 1.1rem; font-weight: 700; letter-spacing: 0.15em; color: var(--teal); text-decoration: none; text-transform: uppercase; }

  .nav-links { display: flex; gap: 2.5rem; list-style: none; }
  .nav-links a { font-family: var(--font-display); font-size: 0.85rem; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted); text-decoration: none; transition: color 0.2s; }
  .nav-links a:hover, .nav-links a.active { color: var(--teal); }
  .nav-social { display: flex; gap: 1.2rem; align-items: center; }
  .nav-social a { font-family: var(--font-display); font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); text-decoration: none; transition: color 0.2s; }
  .nav-social a:hover { color: var(--teal); }

  .page-header { padding: 8rem 2rem 3rem; border-bottom: 1px solid var(--border); background: var(--teal); }
  .page-header .container { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 1.5rem; }
  .page-header-eyebrow { font-family: var(--font-display); font-size: 0.72rem; letter-spacing: 0.3em; text-transform: uppercase; color: rgba(255,255,255,0.65); margin-bottom: 0.75rem; }
  .page-header-title { font-family: var(--font-display); font-size: clamp(3rem, 6vw, 5rem); font-weight: 700; letter-spacing: 0.05em; line-height: 1; color: white; }
  .page-header-title .bold { font-weight: 600; }
  .page-header-count { font-family: var(--font-display); font-size: 0.8rem; letter-spacing: 0.1em; color: rgba(255,255,255,0.6); text-align: right; }
  .page-header-count span { font-size: 2.5rem; font-weight: 600; color: white; display: block; line-height: 1; margin-bottom: 0.3rem; }

  .works-section { padding: 4rem 2rem 7rem; }
  .container { max-width: 1100px; margin: 0 auto; }

  .filter-bar { display: flex; gap: 0.5rem; margin-bottom: 3rem; flex-wrap: wrap; }
  .filter-btn { font-family: var(--font-display); font-size: 0.8rem; letter-spacing: 0.12em; text-transform: uppercase; padding: 0.45rem 1.2rem; border: 1px solid var(--border); background: transparent; color: var(--text-muted); cursor: pointer; transition: all 0.2s; }
  .filter-btn:hover { border-color: var(--teal); color: var(--teal); }
  .filter-btn.active { border-color: var(--teal); background: var(--teal); color: white; }

  .works-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }

  /* 動画ありカード */
  .work-card { background: white; border: 1px solid var(--border); overflow: hidden; transition: all 0.2s; }
  .work-card:hover { border-color: var(--teal-mid); box-shadow: 0 4px 20px rgba(26,155,161,0.08); transform: translateY(-2px); }
  .work-embed { position: relative; padding-bottom: 56.25%; background: #000; cursor: pointer; }
  .work-embed iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
  .work-thumb { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: opacity 0.2s; }
  .work-play-btn { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 56px; height: 56px; background: rgba(26,155,161,0.9); border-radius: 50%; display: flex; align-items: center; justify-content: center; transition: all 0.2s; pointer-events: none; }
  .work-play-btn::after { content: ''; border-left: 20px solid white; border-top: 12px solid transparent; border-bottom: 12px solid transparent; margin-left: 4px; }
  .work-embed:hover .work-play-btn { background: var(--teal); transform: translate(-50%, -50%) scale(1.1); }
  .work-card-meta { padding: 1rem 1.2rem; border-top: 2px solid var(--teal-light); }
  .work-card-meta-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.3rem; }
  .work-card-badge { font-family: var(--font-display); font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--teal); background: var(--teal-light); padding: 0.2rem 0.6rem; white-space: nowrap; }
  .work-card-year { font-family: var(--font-display); font-size: 0.7rem; color: var(--text-dim); letter-spacing: 0.1em; margin-bottom: 0.3rem; }
  .work-card-title { font-family: var(--font-jp); font-size: 0.95rem; font-weight: 400; color: var(--text); margin-bottom: 0.3rem; line-height: 1.4; }
  .work-card-role { font-family: var(--font-display); font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }

  /* 動画なしカード */
  .work-card-text { background: white; border: 1px solid var(--border); overflow: hidden; transition: all 0.2s; display: flex; flex-direction: column; justify-content: space-between; min-height: 120px; padding: 1.5rem 1.2rem; }
  .work-card-text:hover { border-color: var(--teal-mid); box-shadow: 0 4px 20px rgba(26,155,161,0.08); }
  .work-card-text .work-card-year { font-family: var(--font-display); font-size: 0.7rem; color: var(--text-dim); letter-spacing: 0.1em; margin-bottom: 0.5rem; }
  .work-card-text .work-card-title { font-family: var(--font-jp); font-size: 0.95rem; font-weight: 400; color: var(--text); margin-bottom: 0.5rem; line-height: 1.5; }
  .work-card-text .work-card-role { font-family: var(--font-display); font-size: 0.75rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
  .work-card-type { font-family: var(--font-display); font-size: 0.65rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); margin-top: 0.8rem; padding-top: 0.8rem; border-top: 1px solid var(--border); }

  .loading-msg { color: var(--text-dim); font-family: var(--font-display); font-size: 0.8rem; letter-spacing: 0.1em; padding: 2rem 0; }
  .error-msg { color: #c87070; font-family: var(--font-jp); font-size: 0.85rem; padding: 2rem 0; line-height: 1.8; }

  footer { background: var(--teal-dark); border-top: none; padding: 1.5rem 3rem; display: flex; align-items: center; justify-content: space-between; }
  .footer-logo { font-family: var(--font-display); font-size: 0.8rem; letter-spacing: 0.2em; text-transform: uppercase; color: rgba(255,255,255,0.4); }
  .footer-copy { font-family: var(--font-display); font-size: 0.68rem; color: rgba(255,255,255,0.3); letter-spacing: 0.1em; }



  .work-thumbnail { position: relative; padding-bottom: 56.25%; background: var(--teal-light); overflow: hidden; }
  .work-thumbnail img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
  .work-card:hover .work-thumbnail img { transform: scale(1.03); }
  .work-thumbnail-fallback { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: var(--text-dim); font-family: var(--font-display); font-size: 0.7rem; letter-spacing: 0.1em; }
  .work-card-link { text-decoration: none; display: block; }
  .ext-badge { display: inline-block; font-family: var(--font-display); font-size: 0.6rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-dim); background: var(--bg2); border: 1px solid var(--border); padding: 0.15rem 0.5rem; margin-left: 0.5rem; vertical-align: middle; }
  .page-top-btn { position: fixed; bottom: 2rem; right: 2rem; z-index: 200; width: 48px; height: 48px; background: var(--teal); border: none; color: white; font-family: var(--font-display); font-size: 1.2rem; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; border-radius: 50%; }
  .page-top-btn.visible { opacity: 1; pointer-events: auto; }
  .page-top-btn:hover { background: var(--teal-dark); }
  .page-top-btn:hover { border-color: var(--accent); color: var(--accent); background: var(--bg2); }
  .fade-in { opacity: 0; transform: translateY(16px); transition: opacity 0.5s ease, transform 0.5s ease; }
  .fade-in.visible { opacity: 1; transform: translateY(0); }

  @media (max-width: 768px) {
    nav { padding: 0 1.5rem; }
    .nav-social { display: none; }
    .nav-links { gap: 1.5rem; }
    .page-header { padding: 8rem 1.5rem 3rem; }
    .works-section { padding: 3rem 1.5rem 5rem; }
    .works-grid { grid-template-columns: 1fr; }
    footer { flex-direction: column; gap: 0.5rem; text-align: center; }
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">JUNPEI <span>TAKATSU</span></a>
  <ul class="nav-links">
    <li><a href="index.html">Top</a></li>
    <li><a href="works.html" class="active">Works</a></li>
    <li><a href="index.html#profile">Profile</a></li>
    <li><a href="index.html#contact">Contact</a></li>
  </ul>
  <div class="nav-social">
    <a href="https://note.com/taka2composite" target="_blank">Note</a>
    <a href="https://twitter.com/J_Taka2" target="_blank">Twitter</a>
    <a href="https://www.facebook.com/junpei.takatsu" target="_blank">Facebook</a>
  </div>
</nav>

<div class="page-header">
  <div class="container">
    <div>
      <p class="page-header-eyebrow">Composite Director / Concept Compositor</p>
      <h1 class="page-header-title">All <span class="bold">Works</span></h1>
    </div>
    <div class="page-header-count">
      <span id="worksCount">—</span>
      works in total
    </div>
  </div>
</div>

<div class="works-section">
  <div class="container">
    <div>
      <div class="filter-bar" id="filterBar">
        <button class="filter-btn active" onclick="filterWorks('all', this)">All</button>
      </div>

    </div>
    <div class="works-grid" id="worksGrid">
      <p class="loading-msg">Loading...</p>
    </div>
  </div>
</div>

<div style="text-align:center; padding:2rem; border-top:1px solid var(--border); background:var(--bg);">
  <button onclick="window.scrollTo({top:0,behavior:'smooth'})" style="font-family:var(--font-display);font-size:0.75rem;letter-spacing:0.15em;text-transform:uppercase;padding:0.75rem 2rem;border:1px solid var(--border-hover);background:transparent;color:var(--text-muted);cursor:pointer;transition:all 0.2s;" onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--accent)'" onmouseout="this.style.borderColor='var(--border-hover)';this.style.color='var(--text-muted)'">↑ Page Top</button>
</div>
<footer>
  <span class="footer-logo">JUNPEI TAKATSU</span>
  <span class="footer-copy">&copy; Junpei Takatsu. All rights reserved. / taka2composite</span>
</footer>

<script>
  const CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSTur1uP4etEukILyzdq3QsUZ6_WG8qj0uWqOFBteQavAEkImRhCeaeNkf0VwdlESRTt8hQ5Qz-ZxnH/pub?gid=0&single=true&output=csv';

  function parseCSV(text) {
    const lines = text.trim().split('\n');
    const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
    return lines.slice(1).map(line => {
      const values = [];
      let cur = '', inQ = false;
      for (let i = 0; i < line.length; i++) {
        const c = line[i];
        if (c === '"') { inQ = !inQ; }
        else if (c === ',' && !inQ) { values.push(cur.trim()); cur = ''; }
        else { cur += c; }
      }
      values.push(cur.trim());
      const obj = {};
      headers.forEach((h, i) => obj[h] = (values[i] || '').replace(/^"|"$/g, ''));
      return obj;
    });
  }

  function getYoutubeId(url) {
    if (!url) return null;
    const m = url.match(/(?:v=|youtu\.be\/|embed\/)([A-Za-z0-9_-]{11})/);
    return m ? m[1] : null;
  }

  function typeToKey(type) {
    return (type || '').trim();
  }

  let allWorks = [];
  let currentCat = 'all';
  let currentSort = 'group';



  function makeCard(w, i, hidden) {
    const url = (w.youtube_url || '').trim();
    const thumbnailUrl = (w.thumbnail_url || '').trim();
    const youtubeId = getYoutubeId(url);
    const hasExternalUrl = url && !youtubeId;
    const cat = typeToKey(w.type);
    const delay = `transition-delay:${(i % 12) * 0.04}s`;
    const hiddenStyle = hidden ? 'display:none;' : '';

    if (thumbnailUrl) {
      // thumbnail_url優先 → 画像サムネイル表示
      const inner = `
        <div class="work-thumbnail">
          <img src="${thumbnailUrl}" alt="${w.title || ''}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
          <div class="work-thumbnail-fallback" style="display:none;">NO IMAGE</div>
        </div>
        <div class="work-card-meta">
          <div class="work-card-meta-header">
            <p class="work-card-year">${w.year || ''}</p>
            <span class="work-card-badge">${w.type || ''}</span>
          </div>
          <p class="work-card-title">${w.title || ''}${url ? ' <span class="ext-badge">↗</span>' : ''}</p>
          <p class="work-card-role">${w.role || ''}</p>
        </div>`;
      if (url) {
        return `<a href="${url}" target="_blank" rel="noopener" class="work-card work-card-link fade-in" data-cat="${cat}" style="${hiddenStyle}${delay}">${inner}</a>`;
      } else {
        return `<div class="work-card fade-in" data-cat="${cat}" style="${hiddenStyle}${delay}">${inner}</div>`;
      }
    } else if (youtubeId) {
      // YouTube動画埋め込み
      return `<div class="work-card fade-in" data-cat="${cat}" style="${hiddenStyle}${delay}">
        <div class="work-embed" onclick="loadVideo(this, '${youtubeId}')">
          <img class="work-thumb" src="https://img.youtube.com/vi/${youtubeId}/mqdefault.jpg" alt="${w.title || ''}" loading="lazy">
          <div class="work-play-btn"></div>
        </div>
        <div class="work-card-meta">
          <div class="work-card-meta-header">
            <p class="work-card-year">${w.year || ''}</p>
            <span class="work-card-badge">${w.type || ''}</span>
          </div>
          <p class="work-card-title">${w.title || ''}</p>
          <p class="work-card-role">${w.role || ''}</p>
        </div>
      </div>`;
    } else if (hasExternalUrl) {
      // 外部URL → microlinkスクリーンショット
      const ogpThumb = `https://api.microlink.io/?url=${encodeURIComponent(url)}&screenshot=true&meta=false&embed=screenshot.url`;
      return `<a href="${url}" target="_blank" rel="noopener" class="work-card work-card-link fade-in" data-cat="${cat}" style="${hiddenStyle}${delay}">
        <div class="work-thumbnail">
          <img src="${ogpThumb}" alt="${w.title || ''}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">
          <div class="work-thumbnail-fallback" style="display:none;">LINK ↗</div>
        </div>
        <div class="work-card-meta">
          <div class="work-card-meta-header">
            <p class="work-card-year">${w.year || ''}</p>
            <span class="work-card-badge">${w.type || ''}</span>
          </div>
          <p class="work-card-title">${w.title || ''} <span class="ext-badge">↗</span></p>
          <p class="work-card-role">${w.role || ''}</p>
        </div>
      </a>`;
    } else {
      // URLなし → テキストカード
      return `<div class="work-card-text fade-in" data-cat="${cat}" style="${hiddenStyle}${delay}">
        <div>
          <p class="work-card-year">${w.year || ''}</p>
          <p class="work-card-title">${w.title || ''}</p>
          <p class="work-card-role">${w.role || ''}</p>
        </div>
        <p class="work-card-type">${w.type || ''}</p>
      </div>`;
    }
  }

  function applyFiltersAndSort() {
    const grid = document.getElementById('worksGrid');

    if (currentSort === 'group') {
      const filtered = allWorks.filter(w => currentCat === 'all' || typeToKey(w.type) === currentCat);
      const byYear = {};
      filtered.forEach(w => {
        const y = w.year || '不明';
        if (!byYear[y]) byYear[y] = [];
        byYear[y].push(w);
      });
      const years = Object.keys(byYear).sort((a, b) => parseInt(b) - parseInt(a));
      grid.innerHTML = years.map(year => `
        <div style="grid-column:1/-1;">
          <div style="font-family:var(--font-display);font-size:0.72rem;letter-spacing:0.25em;text-transform:uppercase;color:var(--teal);padding:1.2rem 0 0.8rem;border-top:2px solid var(--teal-light);display:flex;align-items:center;gap:1rem;margin-bottom:1rem;">
            ${year}<span style="flex:1;height:1px;background:var(--border);"></span>
          </div>
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1.5rem;">
            ${byYear[year].map((w, i) => makeCard(w, i, false)).join('')}
          </div>
        </div>
      `).join('');
    } else {
      const sorted = [...allWorks].sort((a, b) => {
        const diff = (parseInt(b.year) || 0) - (parseInt(a.year) || 0);
        return currentSort === 'new' ? diff : -diff;
      });
      grid.innerHTML = sorted.map((w, i) => {
        const hidden = currentCat !== 'all' && typeToKey(w.type) !== currentCat;
        return makeCard(w, i, hidden);
      }).join('');
    }

    document.querySelectorAll('.fade-in').forEach(el => {
      el.classList.remove('visible');
      void el.offsetWidth;
    });
    observeFadeIns();
  }

  function filterWorks(cat, btn) {
    document.querySelectorAll('#filterBar .filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCat = cat;
    applyFiltersAndSort();
  }

  function observeFadeIns() {
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(e => { if (e.isIntersecting) e.target.classList.add('visible'); });
    }, { threshold: 0.05 });
    document.querySelectorAll('.fade-in').forEach(el => observer.observe(el));
  }

  function renderWorks(works) {
    document.getElementById('worksCount').textContent = works.length;

    // フィルターボタン生成
    const filterBar = document.getElementById('filterBar');
    const usedTypes = [...new Set(works.map(w => typeToKey(w.type)))];
    usedTypes.forEach(key => {
      const btn = document.createElement('button');
      btn.className = 'filter-btn';
      btn.textContent = key;
      btn.onclick = function() { filterWorks(key, this); };
      filterBar.appendChild(btn);
    });

    // 初回も年別グループ表示で描画
    applyFiltersAndSort();
  }

  async function loadData() {
    try {
      const res = await fetch(CSV_URL);
      if (!res.ok) throw new Error('fetch failed');
      const text = await res.text();
      allWorks = parseCSV(text).filter(w => w.year || w.title);
      allWorks.sort((a, b) => (parseInt(b.year) || 0) - (parseInt(a.year) || 0));
      renderWorks(allWorks);
    } catch (e) {
      document.getElementById('worksGrid').innerHTML =
        '<p class="error-msg">データの読み込みに失敗しました。<br>スプレッドシートの公開設定を確認してください。</p>';
    }
  }

  function loadVideo(el, id) {
    el.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1" allowfullscreen allow="autoplay" style="position:absolute;top:0;left:0;width:100%;height:100%;border:none;"></iframe>`;
  }

  loadData();
</script>
<button class="page-top-btn" id="pageTopBtn" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="ページトップへ">↑</button>
<script>
  const pageTopBtn = document.getElementById('pageTopBtn');
  window.addEventListener('scroll', () => {
    pageTopBtn.classList.toggle('visible', window.scrollY > 300);
  });
</script>
</body>
</html>
